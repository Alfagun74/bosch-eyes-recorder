name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Redact all secrets**
        (refresh tokens, access tokens, camera credentials, IPs, account IDs)
        before posting. Please do not open public security issues; see
        SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy ...
        2. Open ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.2.0 or commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: CapRover 1.x on Ubuntu 24.04, amd64
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      options:
        - LOCAL
        - REMOTE
        - unknown
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / status (redacted)
      description: Output of `docker logs` and `/status` with secrets redacted.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I removed all secrets and personal data from this report.
          required: true
        - label: I checked docs/TROUBLESHOOTING.md.
          required: true
