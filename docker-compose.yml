services:
  bosch-recorder:
    build:
      context: .
      args:
        MEDIAMTX_VERSION: "${MEDIAMTX_VERSION:-1.21.1}"
    image: bosch-eyes-recorder:latest
    container_name: bosch-eyes-recorder
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "80:80"
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      RETENTION_DAYS: "${RETENTION_DAYS:-7}"
      SEGMENT_MINUTES: "${SEGMENT_MINUTES:-10}"
      HIGH_QUALITY: "${HIGH_QUALITY:-false}"
      MIN_FREE_GB: "${MIN_FREE_GB:-5}"
      MAX_STORAGE_GB: "${MAX_STORAGE_GB:-0}"
      CONNECTION_TYPE: "${CONNECTION_TYPE:-LOCAL}"
      BOSCH_REFRESH_TOKEN: "${BOSCH_REFRESH_TOKEN:-}"
      BOSCH_CAMERA_ID: "${BOSCH_CAMERA_ID:-}"
      BOSCH_CAMERA_NAME: "${BOSCH_CAMERA_NAME:-}"
      CAMERA_HOST: "${CAMERA_HOST:-}"
      WEB_PASSWORD: "${WEB_PASSWORD:-}"
      TRANSCODE_ENABLED: "${TRANSCODE_ENABLED:-false}"
      TRANSCODE_EXISTING: "${TRANSCODE_EXISTING:-true}"
      TRANSCODE_ENCODER: "${TRANSCODE_ENCODER:-av1_qsv}"
      TRANSCODE_CONTAINER: "${TRANSCODE_CONTAINER:-webm}"
      TRANSCODE_QUALITY: "${TRANSCODE_QUALITY:-32}"
      TRANSCODE_PRESET: "${TRANSCODE_PRESET:-slow}"
      TRANSCODE_AUDIO_BITRATE: "${TRANSCODE_AUDIO_BITRATE:-48k}"
      TRANSCODE_BITRATE: "${TRANSCODE_BITRATE:-}"
      TRANSCODE_DEVICE: "${TRANSCODE_DEVICE:-/dev/dri/renderD128}"
      TRANSCODE_MIN_AGE_SECONDS: "${TRANSCODE_MIN_AGE_SECONDS:-30}"
      FFMPEG_BINARY: "${FFMPEG_BINARY:-/usr/lib/jellyfin-ffmpeg/ffmpeg}"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
